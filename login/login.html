<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worship - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="matrix-bg">
        <canvas id="matrixCanvas"></canvas>
    </div>

    <!-- Botón Volver al Inicio -->
    <a href="../index.html" class="btn-back-home">← VOLVER AL INICIO</a>

    <div class="login-container">
        <div class="login-box">
            <div class="terminal-header">
                <span class="terminal-title">✦ PANEL ADMINISTRADOR - WORSHIP</span>
                <span class="terminal-buttons">
                    <span class="btn-close">⊗</span>
                </span>
            </div>

            <div class="terminal-content">
                <div class="login-title">
                    <h1>WORSHIP</h1>
                    <p class="subtitle">Solo Admin</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="email" class="input-label">
                            <span class="label-text">Usuario/Correo</span>
                            <span class="label-symbol">$_</span>
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="input-field"
                            placeholder="correo@ejemplo.com"
                            required
                        >
                        <div class="input-underline"></div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="input-label">
                            <span class="label-text">Contraseña</span>
                            <span class="label-symbol">$_</span>
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="input-field"
                            placeholder="••••••••••"
                            required
                        >
                        <div class="input-underline"></div>
                    </div>

                    <div id="loadingBar" class="loading-bar" style="display: none;">
                        <div class="loading-progress"></div>
                    </div>

                    <button type="submit" class="login-btn" id="loginBtn">
                        <span class="btn-text">INGRESAR AL SISTEMA</span>
                        <span class="btn-animation"></span>
                    </button>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>
                </form>

                <div class="login-footer">
                    <p>¿Primer acceso? <a href="../index.html#section-contact" class="footer-link">Solicitar acceso</a></p>
                    <p><a href="#" class="footer-link">¿Contraseña olvidada?</a></p>
                </div>
            </div>

            <div class="terminal-footer">
                <span class="footer-text">Sistema de Autenticación v2.0 | Estado: Conectado</span>
            </div>
        </div>
    </div>

    <script src="matrix-effect.js"></script>
    <script src="login.js"></script>
</body>
</html>
