name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Cambia a 'master' si es tu rama principal

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: version1 # Define que todos los comandos 'run' se ejecuten en la subcarpeta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: version1/package-lock.json # Ruta explícita para que el caché funcione

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          npm run build
          touch dist/.nojekyll
        env:
          VITE_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'version1/dist' # Sube solo la carpeta dist generada dentro de version1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4