<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Triángulo 3D Neón y Círculo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- 1. Crear el Triángulo Grueso (TubeGeometry) ---
    const points = [
        new THREE.Vector3(0, 1.5, 0),    // Arriba
        new THREE.Vector3(1.5, -1, 0),   // Derecha
        new THREE.Vector3(-1.5, -1, 0),  // Izquierda
        new THREE.Vector3(0, 1.5, 0)     // Cerrar
    ];
    const path = new THREE.CatmullRomCurve3(points);
    const triangleGeo = new THREE.TubeGeometry(path, 64, 0.15, 8, false);
    const triangleMat = new THREE.MeshStandardMaterial({ 
        color: 0xff00ff, // Magenta Neón
        emissive: 0xff00ff,
        emissiveIntensity: 2
    });
    const triangle = new THREE.Mesh(triangleGeo, triangleMat);
    scene.add(triangle);

    // --- 2. Crear el Círculo del Centro (Oculto al inicio) ---
    const circleGeo = new THREE.TorusGeometry(2.5, 0.05, 16, 100);
    const circleMat = new THREE.MeshStandardMaterial({ 
        color: 0x00ffff, // Cian Neón
        emissive: 0x00ffff,
        emissiveIntensity: 2,
        transparent: true,
        opacity: 0
    });
    const circle = new THREE.Mesh(circleGeo, circleMat);
    scene.add(circle);

    // --- 3. Luces para el efecto 3D ---
    const light = new THREE.PointLight(0xffffff, 100);
    light.position.set(2, 2, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // --- 4. Animación ---
    let progress = 0;
    const speed = 0.006;
    const startX = -12;
    const endX = 0;

    function animate() {
        requestAnimationFrame(animate);

        if (progress < 1) {
            progress += speed;

            // Movimiento e impacto
            triangle.position.x = startX + (endX - startX) * progress;
            
            // Giro 360 sobre el eje X (Atrás/Adelante)
            triangle.rotation.x = progress * Math.PI * 2;

        } else {
            // Cuando termina el movimiento, mostramos el círculo
            if (circle.material.opacity < 1) {
                circle.material.opacity += 0.05;
                circle.scale.x = circle.scale.y += 0.01; // Efecto de pulso
            }
            // El triángulo sigue rotando suavemente en el centro
            triangle.rotation.y += 0.01;
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
