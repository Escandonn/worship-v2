<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Layered Design</title>
    <style>
        :root {
            --color-inicio: #00d4ff;
            --color-sobre: #ff0055;
            --color-acerca: #00ff88;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            font-family: 'Arial Black', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* --- NAVBAR RESPONSIVE 3D --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap; /* Soporte responsive */
        }

        .nav-item {
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 10px 20px;
            color: #fff;
            text-transform: uppercase;
            position: relative;
            transition: transform 0.2s ease;
            transform-style: preserve-3d;
        }

        /* Capas de color personalizadas para cada link */
        .nav-item.inicio { text-shadow: 2px 2px 0px var(--color-inicio), 4px 4px 0px rgba(0,0,0,0.5); }
        .nav-item.sobre { text-shadow: 2px 2px 0px var(--color-sobre), 4px 4px 0px rgba(0,0,0,0.5); }
        .nav-item.acerca { text-shadow: 2px 2px 0px var(--color-acerca), 4px 4px 0px rgba(0,0,0,0.5); }

        .nav-item:hover {
            transform: translateY(-5px) scale(1.1);
        }

        /* --- HEADER PRINCIPAL (STATIC 3D) --- */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            perspective: 1000px;
        }

        .layered-title {
            font-size: clamp(3rem, 15vw, 10rem); /* Tamaño fluido según pantalla */
            line-height: 1;
            margin: 0;
            color: #fff;
            transform: rotateX(20deg) rotateZ(-5deg);
            /* El secreto: múltiples sombras para crear volumen */
            text-shadow: 
                1px 1px 0px #ccc,
                2px 2px 0px #bbb,
                3px 3px 0px #aaa,
                4px 4px 0px #999,
                5px 5px 0px #888,
                6px 6px 0px #777,
                10px 10px 30px rgba(0,0,0,0.8);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: rotateX(20deg) rotateZ(-5deg) translateY(0); }
            50% { transform: rotateX(25deg) rotateZ(-2deg) translateY(-20px); }
        }

        .subtitle {
            margin-top: 20px;
            font-size: 1.2rem;
            letter-spacing: 5px;
            color: var(--color-inicio);
            text-transform: uppercase;
        }

        /* --- MEDIA QUERIES PARA MÓVILES --- */
        @media (max-width: 600px) {
            .nav-container {
                gap: 10px;
            }
            .nav-item {
                font-size: 0.7rem;
                padding: 8px 12px;
            }
            .layered-title {
                text-shadow: 1px 1px 0px #ccc, 3px 3px 0px #888; /* Sombras más cortas en móvil */
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="#" class="nav-item inicio">Inicio</a>
            <a href="#" class="nav-item sobre">Sobre Nosotros</a>
            <a href="#" class="nav-item acerca">Acerca de</a>
        </div>
    </nav>

  

</body>
</html>
